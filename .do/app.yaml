name: myhunter-backend
region: fra # Frankfurt region (or change to nyc, lon, etc.)

services:
  - name: api
    github:
      repo: anano303/myhunter
      branch: main
      deploy_on_push: true
    source_dir: /server
    
    # Build configuration
    build_command: npm install && npm run build
    
    # Run configuration
    run_command: npm run start
    
    # Environment
    environment_slug: node-js
    instance_size_slug: basic-xxs # $5/month (512MB RAM, 1 vCPU)
    instance_count: 1
    
    # HTTP configuration
    http_port: 8080
    
    # Health check for /docs endpoint
    health_check:
      http_path: /docs
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    # Environment variables (შეცვალე შენი real values-ით)
    envs:
      - key: NODE_ENV
        value: production
        
      - key: PORT
        value: "8080"
        
      # MongoDB Atlas
      - key: DATABASE_URL
        value: ${MONGODB_URI}
        type: SECRET
        
      # JWT
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET
        
      - key: JWT_REFRESH_SECRET
        value: ${JWT_REFRESH_SECRET}
        type: SECRET
        
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        value: ${CLOUDINARY_CLOUD_NAME}
        type: SECRET
        
      - key: CLOUDINARY_API_KEY
        value: ${CLOUDINARY_API_KEY}
        type: SECRET
        
      - key: CLOUDINARY_API_SECRET
        value: ${CLOUDINARY_API_SECRET}
        type: SECRET
        
      # AWS S3
      - key: AWS_ACCESS_KEY_ID
        value: ${AWS_ACCESS_KEY_ID}
        type: SECRET
        
      - key: AWS_SECRET_ACCESS_KEY
        value: ${AWS_SECRET_ACCESS_KEY}
        type: SECRET
        
      - key: AWS_REGION
        value: ${AWS_REGION}
        
      - key: AWS_S3_BUCKET
        value: ${AWS_S3_BUCKET}
        
      # Email
      - key: EMAIL_HOST
        value: smtp.gmail.com
        
      - key: EMAIL_PORT
        value: "587"
        
      - key: EMAIL_USER
        value: ${EMAIL_USER}
        type: SECRET
        
      - key: EMAIL_PASSWORD
        value: ${EMAIL_PASSWORD}
        type: SECRET
        
      - key: EMAIL_FROM
        value: ${EMAIL_FROM}
        
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        value: ${GOOGLE_CLIENT_ID}
        type: SECRET
        
      - key: GOOGLE_CLIENT_SECRET
        value: ${GOOGLE_CLIENT_SECRET}
        type: SECRET
        
      - key: GOOGLE_CALLBACK_URL
        value: https://myhunter-pj436.ondigitalocean.app/auth/google/callback
        
      # Facebook
      - key: FACEBOOK_APP_ID
        value: ${FACEBOOK_APP_ID}
        type: SECRET
        
      - key: FACEBOOK_APP_SECRET
        value: ${FACEBOOK_APP_SECRET}
        type: SECRET
        
      # BOG Payment
      - key: BOG_CLIENT_ID
        value: ${BOG_CLIENT_ID}
        type: SECRET
        
      - key: BOG_SECRET_KEY
        value: ${BOG_SECRET_KEY}
        type: SECRET
        
      # PayPal
      - key: PAYPAL_CLIENT_ID
        value: ${PAYPAL_CLIENT_ID}
        type: SECRET
        
      - key: PAYPAL_CLIENT_SECRET
        value: ${PAYPAL_CLIENT_SECRET}
        type: SECRET
        
      - key: PAYPAL_MODE
        value: sandbox
        
      # OpenAI
      - key: OPENAI_API_KEY
        value: ${OPENAI_API_KEY}
        type: SECRET
        
      # Frontend URL
      - key: FRONTEND_URL
        value: https://www.myhunter.ge

databases:
  # MongoDB Atlas-ს ვიყენებთ external-ად, ამიტომ აქ არაფერია საჭირო
